spring.application.name=backend

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/projectforge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=9090

# JWT
jwt.secret=ProjectForgeSecretKeyForJWTAuthenticationMustBe256BitsLong1234567890AB
jwt.expiration.ms=86400000
